<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видео</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
    }

    main {
      display: grid;
      gap: 16px;
      width: min(100%, 720px, calc((100svh - 32px) * 16 / 9));
      margin-inline: auto;
    }

    .playback-info {
      font: 16px/1.5 system-ui, sans-serif;
    }

    .playback-info p {
      margin: 0;
    }

    .playback-info p + p {
      margin-top: 8px;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <main>
    <div class="playback-info">
      <p lang="ru">Первое видео запускается вручную, второе — автоматически без звука, если браузер разрешает автозапуск.</p>
      <p lang="en">The first video is started manually. The second starts automatically without sound if the browser allows autoplay.</p>
    </div>

    <video controls playsinline>
      <source src="https://ymbrocore.github.io/testpages/inside.mp4" type="video/mp4">
    </video>

    <video id="autoplay-video" controls autoplay muted playsinline>
      <source src="https://ymbrocore.github.io/testpages/video.webm" type="video/webm">
    </video>
  </main>
  <script>
    document.getElementById("autoplay-video").play().catch((error) => {
      console.info("Autoplay did not start. Use the player controls.", error);
    });
  </script>
</body>
</html>
